[package]
name = "touchpad-snap"
version = "0.5.1"
edition = "2024"
rust-version = "1.88"
description = "Switch between windows of the same app with hotkeys and touchpad swipes (GNOME, Windows)"
license = "MIT"
repository = "https://github.com/hjosugi/touchpad-snap"
readme = "README.md"
keywords = ["window-switcher", "gnome", "wayland", "windows", "gestures"]
categories = ["command-line-utilities", "gui"]

[features]
default = []
# Read touchpad swipes directly from libinput (Linux; needs libinput, libudev
# and the user in the input group). See README.md.
libinput = ["dep:input"]

[dependencies]
anyhow = "1.0.104"
clap = { version = "4.6.9", features = ["derive"] }
dirs = "7.0.0"
schemars = { version = "1.2.1", features = ["derive"] }
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.154"
toml = "1.2.2"

[target."cfg(windows)".dependencies]
windows-sys = { version = "0.61.2", features = ["Win32_Foundation", "Win32_UI_WindowsAndMessaging", "Win32_UI_Shell", "Win32_System_Threading", "Win32_System_Com", "Win32_Graphics_Dwm", "Win32_UI_Input", "Win32_UI_Input_KeyboardAndMouse", "Win32_Devices_HumanInterfaceDevice", "Win32_System_Registry", "Win32_Security", "Win32_Graphics_Gdi", "Win32_System_LibraryLoader"] }

[target.'cfg(target_os = "linux")'.dependencies]
zbus = "5"
input = { version = "0.10", optional = true }

[profile.release]
lto = true
codegen-units = 1
strip = true
