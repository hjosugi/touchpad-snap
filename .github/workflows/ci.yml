name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: always

jobs:
  rust:
    name: Rust (${{ matrix.os }})
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy, rustfmt
      - uses: Swatinem/rust-cache@v2
      - run: cargo fmt --check
      - run: cargo clippy --all-targets --locked -- -D warnings
      - run: cargo test --locked

  windows-arm64:
    name: Rust (windows aarch64, build only)
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: aarch64-pc-windows-msvc
      - uses: Swatinem/rust-cache@v2
      - run: cargo build --locked --target aarch64-pc-windows-msvc

  extension:
    name: GNOME extension unit tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 22
      - run: npm test

  gnome-e2e:
    name: End-to-end (headless GNOME Shell ${{ matrix.gnome }})
    strategy:
      fail-fast: false
      matrix:
        include:
          - gnome: 46 (Ubuntu 24.04)
            runner: ubuntu-24.04
    runs-on: ${{ matrix.runner }}
    steps:
      - uses: actions/checkout@v7
      - name: Install GNOME Shell and test clients
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            gnome-shell gnome-text-editor gnome-calculator \
            dbus-daemon dbus-x11 libglib2.0-bin jq fuse3 mesa-utils
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - run: cargo build --locked --all-targets
      - run: ./test/e2e/gnome.sh

  windows-e2e:
    name: End-to-end (Windows Server 2022 desktop)
    runs-on: windows-2022
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - run: cargo build --locked
      - run: ./test/e2e/windows.ps1 -Bin target/debug/window-jump.exe
        shell: pwsh
