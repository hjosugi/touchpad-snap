name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: always

jobs:
  rust:
    name: Rust (${{ matrix.os }})
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy, rustfmt
      - uses: Swatinem/rust-cache@v2
      - run: cargo fmt --check
      - run: cargo clippy --all-targets --locked -- -D warnings
      - run: cargo test --locked

  windows-arm64:
    name: Rust (windows aarch64, build only)
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: aarch64-pc-windows-msvc
      - uses: Swatinem/rust-cache@v2
      - run: cargo build --locked --target aarch64-pc-windows-msvc

  extension:
    name: GNOME extension unit tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 22
      - run: npm test

  gnome-e2e:
    name: End-to-end (headless GNOME Shell, ${{ matrix.name }})
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: Ubuntu 24.04 / GNOME 46
            runner: ubuntu-24.04
          - name: Debian 13 / GNOME 48
            runner: ubuntu-latest
            container: debian:trixie
          - name: Fedora 43 / GNOME 49
            runner: ubuntu-latest
            container: fedora:43
          - name: Fedora 44 / GNOME 50
            runner: ubuntu-latest
            container: fedora:44
          - name: Arch Linux / latest GNOME
            runner: ubuntu-latest
            container: archlinux:latest
    runs-on: ${{ matrix.runner }}
    container: ${{ matrix.container }}
    steps:
      - name: Install GNOME Shell, test clients and build tools
        run: |
          set -eux
          if command -v dnf >/dev/null; then
            dnf install -y --setopt=install_weak_deps=False \
              gnome-shell gnome-text-editor gnome-calculator \
              dbus-daemon dbus-tools glib2 jq util-linux fuse3 mesa-dri-drivers mesa-libEGL \
              gcc git curl tar gzip findutils
          elif command -v pacman >/dev/null; then
            pacman -Syu --noconfirm --needed \
              gnome-shell gnome-text-editor gnome-calculator \
              dbus glib2 jq util-linux fuse3 mesa gcc git curl
          elif [ "$(id -u)" = 0 ]; then
            export DEBIAN_FRONTEND=noninteractive
            apt-get update
            apt-get install -y --no-install-recommends \
              gnome-shell gnome-text-editor gnome-calculator \
              dbus-daemon dbus-bin libglib2.0-bin jq fuse3 util-linux libgl1-mesa-dri libegl1 \
              gcc libc6-dev git curl ca-certificates
          else
            sudo apt-get update
            sudo apt-get install -y --no-install-recommends \
              gnome-shell gnome-text-editor gnome-calculator \
              dbus-daemon dbus-x11 libglib2.0-bin jq fuse3 mesa-utils
          fi
          gnome-shell --version
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
        with:
          key: ${{ matrix.name }}
      - run: cargo build --locked --all-targets
      - run: ./test/e2e/gnome.sh

  windows-e2e:
    name: End-to-end (Windows Server 2022 desktop)
    runs-on: windows-2022
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - run: cargo build --locked
      - run: ./test/e2e/windows.ps1 -Bin target/debug/window-jump.exe
        shell: pwsh

  gnome-vm:
    name: GNOME VM (real touchpad swipes through libinput)
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7
      - name: Let the runner user use KVM
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' \
            | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm
      - uses: cachix/install-nix-action@v32
        with:
          extra_nix_config: |
            system-features = nixos-test benchmark big-parallel kvm
      # The driver runs outside the Nix sandbox here so that its screenshots
      # survive a failure (`nix build .#checks.x86_64-linux.vm-touchpad` is
      # the same test, sandboxed).
      - run: nix build .#checks.x86_64-linux.vm-touchpad.driver -L
      - run: mkdir -p vm-out && ./result/bin/nixos-test-driver --output_directory vm-out
      - uses: actions/upload-artifact@v7
        if: always()
        with:
          name: vm-screenshots
          path: vm-out/*.png
          if-no-files-found: ignore
