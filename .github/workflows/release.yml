name: Release

# Push a tag like v0.1.0 to build every binary and publish a GitHub release.
on:
  push:
    tags: ['v*']
  workflow_dispatch:
    inputs:
      tag:
        description: Existing tag to (re)build and publish
        required: true

permissions:
  contents: write

env:
  CARGO_TERM_COLOR: always
  TAG: ${{ inputs.tag || github.ref_name }}

jobs:
  build:
    name: Build ${{ matrix.target }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - target: x86_64-unknown-linux-musl
            os: ubuntu-latest
          - target: aarch64-unknown-linux-musl
            os: ubuntu-24.04-arm
          - target: x86_64-pc-windows-msvc
            os: windows-latest
          - target: aarch64-pc-windows-msvc
            os: windows-latest
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ env.TAG }}
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}
      - if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install -y musl-tools
      - run: cargo build --release --locked --target ${{ matrix.target }}
      # The settings window needs dlopen; the musl Linux build stays the
      # daemon only, and Linux gets the GUI from source or a distro package.
      - if: runner.os == 'Windows'
        run: cargo build -p touchpad-snap-gui --release --locked --target ${{ matrix.target }}

      - name: Sign (Windows)
        if: runner.os == 'Windows' && vars.WINDOWS_SIGNING == 'true'
        shell: pwsh
        env:
          CERT_PFX_BASE64: ${{ secrets.WINDOWS_CERT_PFX }}
          CERT_PASSWORD: ${{ secrets.WINDOWS_CERT_PASSWORD }}
        run: |
          $pfx = Join-Path $env:RUNNER_TEMP "touchpad-snap.pfx"
          [IO.File]::WriteAllBytes($pfx, [Convert]::FromBase64String($env:CERT_PFX_BASE64))
          foreach ($exe in @("touchpad-snap.exe", "touchpad-snapw.exe", "touchpad-snap-settings.exe")) {
            $path = "target/${{ matrix.target }}/release/$exe"
            & signtool sign /f $pfx /p $env:CERT_PASSWORD /fd SHA256 /tr http://timestamp.digicert.com /td SHA256 $path
            if ($LASTEXITCODE -ne 0) { throw "signtool failed for $exe" }
            $sig = Get-AuthenticodeSignature $path
            if ($sig.Status -ne "Valid") { throw "signature for $exe is $($sig.Status)" }
          }
          Remove-Item $pfx

      - name: Package (Linux)
        if: runner.os == 'Linux'
        run: |
          name="touchpad-snap-${TAG}-${{ matrix.target }}"
          mkdir -p "dist/$name"
          cp "target/${{ matrix.target }}/release/touchpad-snap" README.md README.ja.md LICENSE "dist/$name/"
          cp contrib/systemd/touchpad-snap.service "dist/$name/"
          tar -C dist -czf "dist/$name.tar.gz" "$name"
          rm -rf "dist/$name"
      - name: Package (Windows)
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          $name = "touchpad-snap-$env:TAG-${{ matrix.target }}"
          New-Item -ItemType Directory -Force "dist/$name" | Out-Null
          Copy-Item "target/${{ matrix.target }}/release/touchpad-snap.exe", "target/${{ matrix.target }}/release/touchpad-snapw.exe", "target/${{ matrix.target }}/release/touchpad-snap-settings.exe", README.md, README.ja.md, LICENSE "dist/$name/"
          Compress-Archive -Path "dist/$name" -DestinationPath "dist/$name.zip"
          Remove-Item -Recurse "dist/$name"
      - uses: actions/upload-artifact@v7
        with:
          name: dist-${{ matrix.target }}
          path: dist/*

  extension:
    name: Package the GNOME Shell extension
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ env.TAG }}
      # The layout `gnome-extensions install` expects: metadata.json at the root.
      - run: python3 scripts/extension-zip.py
      - uses: actions/upload-artifact@v7
        with:
          name: dist-extension
          path: dist/*

  publish:
    name: Publish the release
    needs: [build, extension]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ env.TAG }}
      - uses: actions/download-artifact@v8
        with:
          pattern: dist-*
          path: dist
          merge-multiple: true
      - name: Checksums
        run: cd dist && sha256sum -- * > SHA256SUMS && cat SHA256SUMS
      - name: Release notes from CHANGELOG.md
        run: |
          version="${TAG#v}"
          awk -v v="$version" '
            /^## / { if (found) exit; if (index($0, "[" v "]")) { found = 1; next } }
            found { print }
          ' CHANGELOG.md > notes.md
          test -s notes.md || echo "See CHANGELOG.md." > notes.md
          cat notes.md
      - name: Create or update the release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          if gh release view "$TAG" >/dev/null 2>&1; then
            gh release upload "$TAG" dist/* --clobber
            gh release edit "$TAG" --notes-file notes.md
          else
            gh release create "$TAG" dist/* --title "touchpad-snap $TAG" --notes-file notes.md --verify-tag
          fi

  packaging:
    name: Package manifests (AUR, winget, Scoop)
    needs: [publish]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ env.TAG }}
      - name: Update the manifests from the published checksums
        env:
          GH_TOKEN: ${{ github.token }}
        run: scripts/update-packaging.py "${TAG#v}"
      - name: Check the manifests against the published checksums
        env:
          GH_TOKEN: ${{ github.token }}
        run: scripts/check-packaging.py "${TAG#v}"
      - uses: actions/upload-artifact@v7
        with:
          name: packaging-${{ env.TAG }}
          path: |
            packaging/aur/**
            packaging/winget/**
            packaging/scoop/**
          include-hidden-files: true
          if-no-files-found: error
