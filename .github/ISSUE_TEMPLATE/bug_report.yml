name: Bug report
description: Something does not switch, grab or swipe the way it should
labels: [bug]
body:
  - type: textarea
    id: what
    attributes:
      label: What happened, and what did you expect?
    validations:
      required: true
  - type: textarea
    id: doctor
    attributes:
      label: Output of `touchpad-snap doctor`
      render: text
    validations:
      required: true
  - type: textarea
    id: log
    attributes:
      label: Output of `touchpad-snap daemon -v` while reproducing (if the daemon is involved)
      render: text
  - type: input
    id: platform
    attributes:
      label: Platform
      description: e.g. Fedora 43, GNOME 49, Wayland / Windows 11 24H2
    validations:
      required: true
  - type: input
    id: version
    attributes:
      label: touchpad-snap version (`touchpad-snap --version`)
    validations:
      required: true
