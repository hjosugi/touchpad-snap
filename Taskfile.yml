# https://taskfile.dev
version: '3'

vars:
  UUID: touchpad-snap@hjosugi.github.io
  EXTENSION_DIR: '{{.HOME}}/.local/share/gnome-shell/extensions'

tasks:
  default:
    cmds: [task --list]
    silent: true

  build:
    desc: Build the release binary
    cmds:
      - cargo build --release --locked

  test:
    desc: Unit tests (Rust and the extension's JS)
    cmds:
      - cargo test --locked
      - npm test

  lint:
    desc: rustfmt and clippy, for Linux and Windows
    cmds:
      - cargo fmt --check
      - cargo clippy --all-targets --locked -- -D warnings
      - cargo clippy --all-targets --locked --target x86_64-pc-windows-msvc -- -D warnings

  e2e:
    desc: End-to-end test in a throw-away headless GNOME Shell (never touches your desktop)
    cmds:
      - cargo build --all-targets --locked
      - ./test/e2e/gnome.sh

  install:
    desc: Install the binary (cargo install) and the GNOME extension into your home directory
    cmds:
      - cargo install --locked --path .
      - mkdir -p '{{.EXTENSION_DIR}}'
      - rm -rf '{{.EXTENSION_DIR}}/{{.UUID}}'
      - cp -r --no-preserve=mode gnome-extension/{{.UUID}} '{{.EXTENSION_DIR}}/{{.UUID}}'
      - |
        echo
        echo "Installed. Next:"
        echo "  1. Log out and back in once (GNOME on Wayland only discovers new extensions at login)."
        echo "  2. gnome-extensions enable {{.UUID}}"
        echo "  3. touchpad-snap doctor && touchpad-snap autostart enable && touchpad-snap daemon &"

  uninstall:
    desc: Remove what `task install` put in your home directory
    cmds:
      - cargo uninstall touchpad-snap || true
      - rm -rf '{{.EXTENSION_DIR}}/{{.UUID}}'
      - touchpad-snap autostart disable 2>/dev/null || rm -f '{{.HOME}}/.config/autostart/touchpad-snap.desktop'

  release:
    desc: 'Tag and push a release: task release -- 0.5.1 (bump Cargo.toml, metadata.json and CHANGELOG.md first)'
    cmds:
      - test -n "{{.CLI_ARGS}}"
      - grep -q '^version = "{{.CLI_ARGS}}"' Cargo.toml
      - "grep -q '\"version-name\": \"{{.CLI_ARGS}}\"' gnome-extension/{{.UUID}}/metadata.json"
      - grep -q '## \[{{.CLI_ARGS}}\]' CHANGELOG.md
      - git tag -a v{{.CLI_ARGS}} -m "touchpad-snap {{.CLI_ARGS}}"
      - git push origin v{{.CLI_ARGS}}
